# Рубрикатор vault (ТЗ §11.1, §12).
# Категория — папка внутри Telegram/, один уровень.
# Модель (этап LLM) может выбирать только из этого списка; всё остальное -> Inbox.
version: 1

default: Inbox

# Правила без LLM: первое совпадение подстроки (регистр не важен).
# Пока пусто: категории выбирает модель, правила можно добавить позже.
rules: []

# Список тем для модели. Используется только в промпте, не в классификации по правилам.
categories:
  - n8n
  - Нейросети
  - Провайдеры
  - Хостинг
  - Жизнь
  - Монетизация
  - Vibecoding
  - Devops
  - VPN
  - Оплата сервисов
  - Архитектура ПО
  - Автоматизация
