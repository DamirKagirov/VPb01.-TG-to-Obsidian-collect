# Рубрикатор vault (ТЗ §11.1, §12).
# Категория — путь внутри Telegram/, максимум два уровня: "Разработка/Python".
# Список тем согласуется вручную; модель (на этапе 5) сможет выбирать только из него.
version: 1

# Куда попадает всё, что не совпало с правилами или в чём классификатор не уверен.
default: Inbox

# Правила без LLM: первое совпадение подстроки (регистр не важен).
# Пример:
# rules:
#   - category: Разработка/Python
#     any: [python, django, fastapi, asyncio]
#   - category: Автоматизация/n8n
#     any: [n8n, webhook, воркфлоу]
rules: []
