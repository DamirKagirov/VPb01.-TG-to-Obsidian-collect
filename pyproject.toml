[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "kbcollector"
version = "0.1.0"
description = "Telegram collections to Markdown knowledge base for Obsidian, published through S3"
readme = "README.md"
requires-python = ">=3.13,<3.14"
authors = [{ name = "Damir Kagirov", email = "kagirovd2@yandex.ru" }]
classifiers = [
  "Private :: Do Not Upload",
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed",
]
dependencies = [
  "aiogram>=3.13,<4",
  "httpx>=0.27",
  "beautifulsoup4>=4.12",
  "lxml>=5.2",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "boto3>=1.34",
  "python-frontmatter>=1.1",
  "PyYAML>=6.0",
  "Jinja2>=3.1",
  "typer>=0.12",
  "rich>=13.7",
  "structlog>=24.1",
  "tenacity>=8.5",
  "python-slugify>=8.0",
  "pathvalidate>=3.2",
  "uuid-utils",
  "tzdata>=2024.1",
]

[dependency-groups]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.23",
  "pytest-cov>=5",
  "respx>=0.21",
  "moto[s3]>=5",
  "freezegun>=1.5",
  "syrupy>=4",
  "hypothesis>=6",
  "ruff>=0.6",
  "mypy>=1.11",
  "boto3-stubs[s3]>=1.34",
  "pre-commit>=3.7",
]

[project.scripts]
kbcollector = "kbcollector.cli.app:main"

[tool.hatch.build.targets.wheel]
packages = ["src/kbcollector"]

[tool.uv]
# Кэш и venv лежат на разных дисках (C: и D:) — hardlink недоступен.
link-mode = "copy"

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "C4", "PT", "DTZ", "ASYNC", "T20", "N"]
ignore = ["E501", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.13"
strict = true
files = ["src"]
warn_unreachable = true
enable_error_code = ["ignore-without-code", "redundant-expr"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
  "integration: requires local integration surface (DB, filesystem, moto S3)",
  "e2e: end-to-end pipeline scenarios",
  "external: hits real external services, never runs by default",
]

[tool.coverage.run]
source = ["src/kbcollector"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
